# Docker Compose uses an embedded DNS server at 127.0.0.11.
# Resolve upstream container names dynamically so gateway survives
# API/frontend container recreation without requiring an Nginx restart.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

map $http_x_forwarded_proto $erp_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream erp_frontend {
    zone erp_frontend 64k;
    server frontend:80 resolve;
}

upstream erp_backend {
    zone erp_backend 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    location = /admin {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
    }

    location /admin/ {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
    }

    location /health/ {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
    }

    location /static/ {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
    }

    location /media/ {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://erp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $erp_forwarded_proto;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
