target-version = "py313"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[format]
docstring-code-format = true

[isort]
known-first-party = [
    "accounts",
    "authsession",
    "common",
    "coupons",
    "customers",
    "invoices",
    "inventory",
    "payments",
    "products",
    "purchases",
    "suppliers",
]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
django = [
    "django",
    "django.contrib",
    "rest_framework",
    "rest_framework_simplejwt",
    "corsheaders",
    "phonenumber_field",
    "django_filters",
    "django_redis",
    "storages",
]
first-party = [
    "accounts",
    "authsession",
    "common",
    "coupons",
    "customers",
    "invoices",
    "inventory",
    "payments",
    "products",
    "purchases",
    "suppliers",
    "core",
]
