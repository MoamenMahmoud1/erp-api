name: Production Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-images:
    name: Backend production images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build web image
        run: docker build --pull --target web -t erp-api-web:ci backend

      - name: Build worker image
        run: docker build --pull --target worker -t erp-api-worker:ci backend

      - name: Validate compose configuration
        run: docker compose -f infra/compose.yaml config

  web-e2e:
    name: Web end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp_e2e
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Migrate and seed E2E database
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.settings_dev
          SECRET_KEY: e2e-local-secret-key-not-for-production
          JWT_SIGNING_KEY: e2e-local-jwt-signing-key-not-for-production
          DB_NAME: erp_e2e
          DB_USER: erp
          DB_PASSWORD: erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_data

      - name: Start backend
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.settings_dev
          SECRET_KEY: e2e-local-secret-key-not-for-production
          JWT_SIGNING_KEY: e2e-local-jwt-signing-key-not-for-production
          DB_NAME: erp_e2e
          DB_USER: erp
          DB_PASSWORD: erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload >/tmp/erp-api-e2e.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/erp-api-e2e.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/erp-frontend-e2e.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/erp-frontend-e2e.log
          exit 1

      - name: Install Playwright
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: node e2e/smoke.mjs
