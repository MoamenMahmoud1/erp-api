name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: core.settings.settings_test
  SECRET_KEY: ci-test-secret
  JWT_SIGNING_KEY: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
  ALLOWED_HOSTS: testserver,localhost,127.0.0.1
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  CSRF_TRUSTED_ORIGINS: http://localhost:3000
  DB_NAME: erp_test
  DB_USER: erp
  DB_PASSWORD: erp
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  REDIS_URL: redis://localhost:6379/0

jobs:
  checks:
    name: Static, Django and production checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.7
          python -m pip check

      - name: Generate accounts migration for schema verification
        run: |
          python manage.py makemigrations accounts --noinput
          cat accounts/migrations/0001_initial.py
          git checkout -- accounts/migrations/ || true

      - name: Verify synchronous-only runtime
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f -path '*async*' -not -path './.git/*' -print -quit | grep -q .; then
            echo "Async-named files are not allowed on main."
            find . -type f -path '*async*' -not -path './.git/*' -print
            exit 1
          fi

          if [[ -e core/asgi.py ]]; then
            echo "core/asgi.py must not exist on the synchronous main branch."
            exit 1
          fi

          if grep -RInE --exclude-dir=.git --include='*.py' \
            -e '(^|[[:space:]])from[[:space:]]+adrf([.]|[[:space:]])' \
            -e '(^|[[:space:]])import[[:space:]]+adrf([.]|[[:space:]])' \
            -e 'sync_to_async' \
            -e '(^|[[:space:]])async[[:space:]]+def[[:space:]]' \
            .; then
            echo "Async-only code was found on the synchronous main branch."
            exit 1
          fi

      - name: Run Django checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Ruff
        run: ruff check .

      - name: Production Django checks
        env:
          DJANGO_SETTINGS_MODULE: core.settings.settings_prod
          DB_NAME: erp_ci
          DB_USER: erp
          DB_PASSWORD: erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_STORAGE_BUCKET_NAME: ""
        run: python manage.py check --deploy --fail-level ERROR

  tests:
    name: Tests / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: authentication
            apps: accounts authsession authentication
          - suite: organization
            apps: organization customers customer_assignments suppliers
          - suite: catalog
            apps: products coupons
          - suite: sales
            apps: invoices payments inventory
          - suite: purchasing
            apps: purchases
          - suite: accounting
            apps: accounting auditlog
          - suite: infrastructure
            apps: core common

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run ${{ matrix.suite }} tests
        run: python manage.py test ${{ matrix.apps }}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build production frontend image
        run: docker build -t erp-api-frontend:ci .
