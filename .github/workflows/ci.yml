name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_test
      SECRET_KEY: ci-test-secret
      JWT_SIGNING_KEY: ci-test-jwt-secret
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_test
      DB_USER: erp
      DB_PASSWORD: erp
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify synchronous-only runtime
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f -path '*async*' -not -path './.git/*' -print -quit | grep -q .; then
            echo "Async-named files are not allowed on main."
            find . -type f -path '*async*' -not -path './.git/*' -print
            exit 1
          fi

          if [[ -e core/asgi.py ]]; then
            echo "core/asgi.py must not exist on the synchronous main branch."
            exit 1
          fi

          if grep -RInE --exclude-dir=.git --include='*.py' \
            -e '(^|[[:space:]])from[[:space:]]+adrf([.]|[[:space:]])' \
            -e '(^|[[:space:]])import[[:space:]]+adrf([.]|[[:space:]])' \
            -e 'sync_to_async' \
            -e '(^|[[:space:]])async[[:space:]]+def[[:space:]]' \
            .; then
            echo "Async-only code was found on the synchronous main branch."
            exit 1
          fi

      - name: Run Django checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      # Ruff is intentionally non-blocking for now.
      # It will be enabled as a required CI check after the sync migration is stable.
      - name: Ruff (non-blocking)
        continue-on-error: true
        run: ruff check .
